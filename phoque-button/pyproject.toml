[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "phoque-button"
version = "0.1.0"
description = "Phoque queuing system button client"
authors = [
    {name = "Timst",email = "timst44@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gpiozero (>=2.0.1,<3.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "pycups (>=2.0.4,<3.0.0)",
    "phoque-shared (>=0.1.0,<0.2.0)",
]

[project.scripts]
phoque-button = "phoque_button.__main__:main"