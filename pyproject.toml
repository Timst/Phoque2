[project]
name = "phoque2"
version = "0.1.0"
description = "Components of the updated Phoque system"
authors = [
    {name = "Timst",email = "timst44@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] (>=0.135.1,<0.136.0)",
    "toml (>=0.10.2,<0.11.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "gpiozero (>=2.0.1,<3.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "pycups (>=2.0.4,<3.0.0)",
    "cachetools (>=7.1.1,<8.0.0)",
    "pyttsx3 (>=2.99,<3.0)",
    "playsound3 (>=3.3.1,<4.0.0)",
    "sparkfun-qwiic-led-stick (>=2.0.0,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false