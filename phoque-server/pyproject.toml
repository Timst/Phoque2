[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "phoque-server"
version = "0.1.0"
description = "Phoque queuing system server"
authors = [
    {name = "Timst",email = "timst44@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] (>=0.135.1,<0.136.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "gpiozero (>=2.0.1,<3.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "cachetools (>=7.1.1,<8.0.0)",
    "phoque-shared @ ../phoque-shared",
]

[project.scripts]
phoque-server = "phoque_server.__main__:main"